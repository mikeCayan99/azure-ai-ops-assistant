name: Deploy API

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build Docker Image
        run: docker build -t azure-ai-ops-assistant:${{ github.sha }} .

      - name: Tag Docker Image for ACR
        run: docker tag azure-ai-ops-assistant:${{ github.sha }} acraiopsmikedev.azurecr.io/azure-ai-ops-assistant:${{ github.sha }}

      - name: Login to ACR
        run: az acr login --name acraiopsmikedev

      - name: Push Docker Image to ACR
        run: docker push acraiopsmikedev.azurecr.io/azure-ai-ops-assistant:${{ github.sha }}

      
      - name: Check if Container App exists
        id: check_app
        run: |
          if az containerapp show \
            --name ca-ai-ops-api-dev \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      
      - name: Deploy Container App
        if: steps.check_app.outputs.exists == 'false'
        run: |
          az containerapp create \
            --name ca-ai-ops-api-dev \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --environment ${{ vars.AZURE_CONTAINER_APP_ENVIRONMENT }} \
            --image acraiopsmikedev.azurecr.io/azure-ai-ops-assistant:${{ github.sha }} \
            --registry-identity ${{ vars.AZURE_MANAGED_IDENTITY_ID }} \
            --user-assigned ${{ vars.AZURE_MANAGED_IDENTITY_ID }} \
            --ingress external \
            --target-port 8000 \
            --min-replicas 0 \
            --max-replicas 1 \
            --cpu 0.25 \
            --memory 0.5Gi \
            --registry-server acraiopsmikedev.azurecr.io \
            --revision-mode single

      - name: Update Container App
        if: steps.check_app.outputs.exists == 'true'
        run: |
          az containerapp update \
            --name ca-ai-ops-api-dev \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image acraiopsmikedev.azurecr.io/azure-ai-ops-assistant:${{ github.sha }}