name: Deploy API

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get API Managed Identity Client ID
        run: |
          API_CLIENT_ID=$(az identity show \
            --ids "${{ vars.AZURE_MANAGED_IDENTITY_ID }}" \
            --query clientId \
            --output tsv)

          echo "API_CLIENT_ID=$API_CLIENT_ID" >> "$GITHUB_ENV"    

      - name: Build Docker Image
        run: docker build -t azure-ai-ops-assistant:${{ github.sha }} .

      - name: Tag Docker Image for ACR
        run: docker tag azure-ai-ops-assistant:${{ github.sha }} acraiopsmikedev.azurecr.io/azure-ai-ops-assistant:${{ github.sha }}

      - name: Login to ACR
        run: az acr login --name acraiopsmikedev

      - name: Push Docker Image to ACR
        run: docker push acraiopsmikedev.azurecr.io/azure-ai-ops-assistant:${{ github.sha }}

      
      - name: Check if Container App exists
        id: check_app
        run: |
          if az containerapp show \
            --name ca-ai-ops-api-dev \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Container App
        if: steps.check_app.outputs.exists == 'false'
        run: |
          az containerapp create \
            --name ca-ai-ops-api-dev \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --environment ${{ vars.AZURE_CONTAINER_APP_ENVIRONMENT }} \
            --image acraiopsmikedev.azurecr.io/azure-ai-ops-assistant:${{ github.sha }} \
            --registry-identity ${{ vars.AZURE_MANAGED_IDENTITY_ID }} \
            --user-assigned ${{ vars.AZURE_MANAGED_IDENTITY_ID }} \
            --env-vars AZURE_CLIENT_ID=$API_CLIENT_ID \
            --min-replicas 0 \
            --max-replicas 1 \
            --cpu 0.25 \
            --memory 0.5Gi \
            --registry-server acraiopsmikedev.azurecr.io

      - name: Update Container App
        if: steps.check_app.outputs.exists == 'true'
        run: |
          az containerapp update \
            --name ca-ai-ops-api-dev \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image acraiopsmikedev.azurecr.io/azure-ai-ops-assistant:${{ github.sha }} \
            --set-env-vars AZURE_CLIENT_ID=$API_CLIENT_ID

      - name: Configure Container App authentication
        run: |
          TENANT_ID="${{ vars.AZURE_TENANT_ID }}"

          az containerapp auth microsoft update \
            --name ca-ai-ops-api-dev \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --client-id ${{ vars.AZURE_AUTH_CLIENT_ID }} \
            --client-secret "${{ secrets.AZURE_AI_OPS_AUTH_CLIENT_SECRET }}" \
            --tenant-id "$TENANT_ID" \
            --issuer "https://login.microsoftonline.com/$TENANT_ID/v2.0" \
            --allowed-audiences api://${{ vars.AZURE_AUTH_CLIENT_ID }} \
            --yes

          az containerapp auth update \
            --name ca-ai-ops-api-dev \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --enabled true \
            --unauthenticated-client-action Return401 \
            --excluded-paths /health

      - name: Enable external ingress
        run: |
          az containerapp ingress enable \
            --name ca-ai-ops-api-dev \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --type external \
            --target-port 8000 \
            --transport auto

      - name: Health Check
        run: |
          APP_FQDN=$(az containerapp show \
            --name ca-ai-ops-api-dev \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          curl --fail "https://${APP_FQDN}/health"